[package]
name = "ratmesh"
description = "RatLabs Mesh: drop in character art, get back a finished, game-ready 3D model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
default-run = "ratmesh"

[features]
default = ["cutout"]
cutout = ["mesh-pipeline/cutout", "mesh-prep/cutout"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
clap = { version = "4", features = ["derive"] }
mesh-core.workspace = true
mesh-prep.workspace = true
mesh-glb.workspace = true
mesh-engines.workspace = true
mesh-blender.workspace = true
mesh-market.workspace = true
mesh-pipeline.workspace = true
mesh-mcp.workspace = true
mesh-server.workspace = true
