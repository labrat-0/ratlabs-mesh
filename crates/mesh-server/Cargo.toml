rust-embed.workspace = true
mime_guess.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
mesh-core.workspace = true
mesh-prep.workspace = true
mesh-engines.workspace = true
mesh-blender.workspace = true
mesh-market.workspace = true
mesh-pipeline.workspace = true
mesh-mcp.workspace = true
