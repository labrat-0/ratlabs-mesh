# Tag v* to publish binaries to a GitHub Release.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p ratmesh
      - name: Package
        shell: bash
        run: |
          name=ratmesh-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp README.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/${{ matrix.target }}/release/ratmesh.exe "$name/"
            7z a "$name.zip" "$name" >/dev/null
          else
            cp target/${{ matrix.target }}/release/ratmesh "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: ratmesh-*.*
          generate_release_notes: true
