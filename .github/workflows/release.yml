# Tag v* to publish binaries to a GitHub Release. Run it by hand (Actions > Release > Run workflow)
# for a dry run: everything builds, nothing is published.
# Archives are versionless (ratmesh-<target>.tar.gz / .zip) so
# https://github.com/labrat-0/ratlabs-mesh/releases/latest/download/<name> always points at the newest.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONNX Runtime's prebuilt static library needs GCC 14's libstdc++, which Ubuntu 24.04 ships:
          # the Linux binaries run on glibc 2.39+ (Ubuntu 24.04, Debian 13, Fedora 40, Arch...).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p ratmesh
      - name: Report the glibc / libstdc++ the binary needs
        if: runner.os == 'Linux'
        run: objdump -T target/${{ matrix.target }}/release/ratmesh | grep -oE 'GLIBC(XX)?_[0-9.]+' | sort -Vu | tail -4
      - name: Package
        shell: bash
        run: |
          name=ratmesh-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE ART-LICENSE.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/${{ matrix.target }}/release/ratmesh.exe "$name/"
            7z a "$name.zip" "$name" >/dev/null
          else
            cp target/${{ matrix.target }}/release/ratmesh "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ratmesh-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job can create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - run: sha256sum ratmesh-* > SHA256SUMS && cat SHA256SUMS && [ "$(wc -l < SHA256SUMS)" -eq 4 ]
      - if: startsWith(github.ref, 'refs/tags/v')   # dry runs stop after checksums
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ratmesh-*
            SHA256SUMS
          generate_release_notes: true
